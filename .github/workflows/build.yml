name: CI

on:
  push:
    branches: ['**']
  pull_request:
    types: [opened, synchronize, reopened, edited]
  workflow_dispatch:
    inputs:
      full_release:
        description: Build and validate the image and all seven binary targets without publishing
        type: boolean
        default: false
  workflow_call:
    secrets:
      GIT_CREDENTIALS:
        required: true

permissions:
  contents: read
  actions: read
  pull-requests: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  RUSTFLAGS: -D warnings
  RUSTDOCFLAGS: -D warnings

jobs:
  route:
    name: Select checks
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.route.outputs.run }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/github-script@v7
        id: route
        with:
          script: |
            const route = require('./.github/scripts/route-ci.cjs');
            await route({ github, context, core });

  check:
    name: static
    needs: route
    if: >-
      needs.route.outputs.run == 'true' &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - uses: ./.github/actions/setup-cargo
        with:
          cache-key: static
          credentials: ${{ secrets.GIT_CREDENTIALS }}
      - name: Validate workflow contracts
        run: |
          just config-check
          just workflow-test
          node --test tests/workflow/*.cjs
          python3 -m unittest discover -s tests/workflow -p 'test_*.py' -v
      - name: Run static Rust checks
        env:
          CARGO_NET_OFFLINE: 'true'
        run: just check
      - uses: crate-ci/typos@v1.34.0

  test:
    needs: route
    if: >-
      needs.route.outputs.run == 'true' &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    uses: ./.github/workflows/test.yml
    secrets: inherit

  gate:
    name: ci-gate
    needs: [route, check, test]
    if: always() && (needs.route.outputs.run != 'false' || needs.route.result != 'success')
    runs-on: ubuntu-latest
    steps:
      - name: Require every selected check
        env:
          ROUTE_RESULT: ${{ needs.route.result }}
          STATIC_RESULT: ${{ needs.check.result }}
          TEST_RESULT: ${{ needs.test.result }}
        run: |
          for result in "$ROUTE_RESULT" "$STATIC_RESULT" "$TEST_RESULT"; do
            if [[ "$result" != success ]]; then
              echo 'A required check failed, was cancelled, or was skipped. Forks need reviewed private dependency access.' >&2
              exit 1
            fi
          done

  release-binaries:
    needs: gate
    if: github.event_name == 'workflow_dispatch' && inputs.full_release
    uses: ./.github/workflows/release-binaries.yml
    secrets: inherit

  release-image:
    needs: gate
    if: github.event_name == 'workflow_dispatch' && inputs.full_release
    uses: ./.github/workflows/image.yml
    secrets: inherit

  release-rehearsal:
    name: Full release validation (no publication)
    needs: [release-binaries, release-image]
    if: github.event_name == 'workflow_dispatch' && inputs.full_release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: ${{ runner.temp }}/release-artifacts
      - name: Verify all artifact identities and checksums
        run: >-
          python3 scripts/ci/release.py manifest
          --artifacts "$RUNNER_TEMP/release-artifacts"
          --output "$RUNNER_TEMP/release-manifest"
      - uses: actions/upload-artifact@v4
        with:
          name: rehearsal-manifest-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/release-manifest/release-manifest.json
            ${{ runner.temp }}/release-manifest/SHA256SUMS
          retention-days: 7
