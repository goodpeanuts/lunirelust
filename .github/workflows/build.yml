name: CI

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
    types: [opened, synchronize, reopened, edited]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  RUSTFLAGS: -D warnings
  RUSTDOCFLAGS: -D warnings

jobs:
  route:
    name: Select checks
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.route.outputs.run }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/github-script@v7
        id: route
        with:
          script: |
            const route = require('./.github/scripts/route-ci.cjs');
            await route({ github, context, core });

  check:
    name: static
    needs: route
    if: >-
      needs.route.outputs.run == 'true' &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - uses: ./.github/actions/setup-cargo
        with:
          cache-key: static
          credentials: ${{ secrets.GIT_CREDENTIALS }}
      - name: Validate workflow contracts
        run: |
          just config-check
          just workflow-test
          node --test tests/workflow/*.cjs
      - name: Run static Rust checks
        env:
          CARGO_NET_OFFLINE: 'true'
        run: just check
      - uses: crate-ci/typos@v1.34.0

  test:
    needs: route
    if: >-
      needs.route.outputs.run == 'true' &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    uses: ./.github/workflows/test.yml
    secrets: inherit

  gate:
    name: ci-gate
    needs: [route, check, test]
    if: always() && (needs.route.outputs.run != 'false' || needs.route.result != 'success')
    runs-on: ubuntu-latest
    steps:
      - name: Require every selected check
        env:
          ROUTE_RESULT: ${{ needs.route.result }}
          STATIC_RESULT: ${{ needs.check.result }}
          TEST_RESULT: ${{ needs.test.result }}
        run: |
          for result in "$ROUTE_RESULT" "$STATIC_RESULT" "$TEST_RESULT"; do
            if [[ "$result" != success ]]; then
              echo 'A required check failed, was cancelled, or was skipped. Forks need reviewed private dependency access.' >&2
              exit 1
            fi
          done

  build:
    # Platform builds only matter for releases; ordinary pushes are gated by
    # the check job and the database test workflow.
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ${{ matrix.os }}
    env:
      CARGO_TERM_COLOR: always
    strategy:
      fail-fast: false
      matrix:
        include:
        - os: macos-latest
          TARGET: aarch64-apple-darwin
          USE_CROSS: false

        - os: macos-latest
          TARGET: x86_64-apple-darwin
          USE_CROSS: false

        - os: ubuntu-latest
          TARGET: arm-unknown-linux-musleabihf
          USE_CROSS: true

        - os: ubuntu-latest
          TARGET: armv7-unknown-linux-musleabihf
          USE_CROSS: true

        - os: ubuntu-latest
          TARGET: x86_64-unknown-linux-musl
          USE_CROSS: false

        - os: windows-latest
          TARGET: x86_64-pc-windows-msvc
          USE_CROSS: false
          EXTENSION: .exe

        - os: ubuntu-latest
          TARGET: x86_64-unknown-linux-gnu
          USE_CROSS: false

    steps:
    - name: Building ${{ matrix.TARGET }}
      run: echo "${{ matrix.TARGET }}"

    - uses: actions/checkout@v4
    - uses: dtolnay/rust-toolchain@master
      with:
        toolchain: 1.92
        targets: ${{ matrix.TARGET }}

    - name: Configure git for private dependencies
      run: git config --global url."https://x-access-token:${{ secrets.GIT_CREDENTIALS }}@github.com/".insteadOf "https://github.com/"

    - name: Install cross
      if: matrix.USE_CROSS == true
      uses: taiki-e/install-action@v2
      with:
        tool: cross

    # Install musl tools for Linux musl targets
    - name: Install musl tools
      if: matrix.TARGET == 'x86_64-unknown-linux-musl'
      run: |
        sudo apt-get update
        sudo apt-get install -y musl-tools

    - name: Run build (with cross)
      if: matrix.USE_CROSS == true
      run: cross build --verbose --release --target=${{ matrix.TARGET }}

    - name: Run build (without cross)
      if: matrix.USE_CROSS == false
      run: cargo build --verbose --release --target=${{ matrix.TARGET }}

    - name: Build migration tool (with cross)
      if: matrix.USE_CROSS == true
      run: cross build --verbose --release --target=${{ matrix.TARGET }} -p migration

    - name: Build migration tool (without cross)
      if: matrix.USE_CROSS == false
      run: cargo build --verbose --release --target=${{ matrix.TARGET }} -p migration

    - name: Upload main artifact
      uses: actions/upload-artifact@v4
      with:
        name: lunirelust-${{ matrix.TARGET }}
        path: target/${{ matrix.TARGET }}/release/lunirelust${{ matrix.EXTENSION }}

    - name: Upload migration artifact
      uses: actions/upload-artifact@v4
      with:
        name: migration-${{ matrix.TARGET }}
        path: target/${{ matrix.TARGET }}/release/migration${{ matrix.EXTENSION }}

  docker:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: [check, test, build]
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: read
      packages: write
      actions: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            GIT_CREDENTIALS=${{ secrets.GIT_CREDENTIALS }}
          tags: |
            ghcr.io/${{ github.repository }}/lunirelust:latest
            ghcr.io/${{ github.repository }}/lunirelust:${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    # The GitHub Release is only created after the image for this tag exists;
    # a failed image push fails the workflow without publishing a release.
    needs: [docker]
    permissions:
      contents: write
      actions: read
      packages: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate changelog
        uses: orhun/git-cliff-action@v4
        id: git-cliff
        with:
          config: cliff.toml
          args: -vv --latest --strip header
        env:
          OUTPUT: CHANGELOG.md

      - name: Download binary artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          # Restrict to release binaries: the docker job also uploads a
          # buildx build-record artifact (*.dockerbuild) that cannot be
          # extracted here and would fail the whole step.
          pattern: "{lunirelust-*,migration-*}"

      - name: List downloaded files
        run: ls -R artifacts

      - name: Prepare release files
        run: |
          mkdir -p release-files

          # Copy main application files with platform-specific names
          for dir in artifacts/lunirelust-*/; do
            platform=$(basename "$dir" | sed 's/lunirelust-//')
            if [ -f "$dir/lunirelust.exe" ]; then
              # Windows platform
              cp "$dir/lunirelust.exe" "release-files/lunirelust-${platform}.exe"
            elif [ -f "$dir/lunirelust" ]; then
              # Unix platforms
              cp "$dir/lunirelust" "release-files/lunirelust-${platform}"
            fi
          done

          # Copy migration tools for all platforms
          for dir in artifacts/migration-*/; do
            platform=$(basename "$dir" | sed 's/migration-//')
            if [ -f "$dir/migration.exe" ]; then
              # Windows platform
              cp "$dir/migration.exe" "release-files/migration-${platform}.exe"
            elif [ -f "$dir/migration" ]; then
              # Unix platforms
              cp "$dir/migration" "release-files/migration-${platform}"
            fi
          done

          ls -la release-files/
          echo "Files to upload:"
          find release-files -type f -exec echo "  - {}" \;

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          body: ${{ steps.git-cliff.outputs.content }}
          files: release-files/*
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
          generate_release_notes: false
