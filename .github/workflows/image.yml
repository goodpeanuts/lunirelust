name: Validate release image

on:
  workflow_call:
    secrets:
      GIT_CREDENTIALS:
        required: true

permissions:
  contents: read
  actions: read

jobs:
  image:
    name: Exact image acceptance (linux/amd64)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      IMAGE: lunirelust-ci:${{ github.sha }}
      DOCKER_BUILD_RECORD_UPLOAD: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/github-script@v7
        id: artifact
        with:
          script: |
            await require('./.github/scripts/find-artifact.cjs')({
              github, context, core, name: 'release-image'
            });
      - uses: actions/download-artifact@v4
        if: steps.artifact.outputs.exists == 'true'
        with:
          name: release-image
          path: ${{ runner.temp }}/release-image
      - uses: docker/setup-buildx-action@v3
        if: steps.artifact.outputs.exists != 'true'
      - name: Build canonical image once
        if: steps.artifact.outputs.exists != 'true'
        env:
          GIT_CREDENTIALS: ${{ secrets.GIT_CREDENTIALS }}
        run: ./scripts/image.sh build "$IMAGE"
      - name: Export the built image and record identity
        if: steps.artifact.outputs.exists != 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/release-image"
          ./scripts/image.sh export "$IMAGE" "$RUNNER_TEMP/release-image/image.tar"
          gzip -n "$RUNNER_TEMP/release-image/image.tar"
          python3 scripts/ci/release.py image-proof --image "$IMAGE" --directory "$RUNNER_TEMP/release-image"
          docker image rm "$IMAGE"
      - name: Accept the exact exported image
        if: steps.artifact.outputs.exists != 'true'
        run: ./scripts/env-run.sh .env.test ./scripts/ci/image-smoke.sh "$RUNNER_TEMP/release-image"
      - name: Verify accepted image artifact
        run: python3 scripts/ci/release.py verify-image --smoked --directory "$RUNNER_TEMP/release-image"
      - uses: actions/upload-artifact@v4
        if: steps.artifact.outputs.exists != 'true'
        with:
          name: release-image
          path: ${{ runner.temp }}/release-image/*
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
