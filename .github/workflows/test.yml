name: Database Tests

permissions:
  contents: read

on: [pull_request, push, workflow_dispatch]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.92
      - name: Configure git for private dependencies
        run: git config --global url."https://x-access-token:${{ secrets.GIT_CREDENTIALS }}@github.com/".insteadOf "https://github.com/"
      - uses: taiki-e/install-action@v2
        with:
          tool: just,cargo-nextest
      - name: Run isolated test workflow
        run: just test
