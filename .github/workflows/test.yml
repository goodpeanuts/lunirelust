name: Database Tests

permissions:
  contents: read

on:
  workflow_call:
    secrets:
      GIT_CREDENTIALS:
        required: true
  workflow_dispatch:

jobs:
  test:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: test-postgres
            recipe: test
          - name: test-search
            recipe: test-search
    env:
      CARGO_TERM_COLOR: always
      RUSTFLAGS: -D warnings
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: taiki-e/install-action@v2
        with:
          tool: just,cargo-nextest
      - uses: ./.github/actions/setup-cargo
        with:
          cache-key: ${{ matrix.name }}
          credentials: ${{ secrets.GIT_CREDENTIALS }}
      - name: Run isolated test workflow
        env:
          CARGO_NET_OFFLINE: 'true'
          TEST_RECIPE: ${{ matrix.recipe }}
        run: just "$TEST_RECIPE"
