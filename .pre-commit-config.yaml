fail_fast: false
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.3.0
    hooks:
      - id: check-byte-order-marker
      - id: check-case-conflict
      - id: check-merge-conflict
      - id: check-symlinks
      - id: check-yaml
        exclude: ^scripts/ci/compose\.image\.yml$
      - id: check-yaml
        name: Check image Compose YAML syntax (custom tags)
        files: ^scripts/ci/compose\.image\.yml$
        args: [--unsafe]
      - id: end-of-file-fixer
      - id: mixed-line-ending
      - id: trailing-whitespace
  - repo: local
    hooks:
      - id: rust-format
        name: Rust formatting
        entry: cargo fmt --all -- --check
        language: system
        pass_filenames: false
        files: \.rs$
