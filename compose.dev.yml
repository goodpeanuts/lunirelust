services:
  postgres:
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - type: bind
        source: ./.local/dev/postgres
        target: /var/lib/postgresql/data

  meilisearch:
    profiles: [hybrid]
    ports:
      - "127.0.0.1:7700:7700"
    volumes:
      - type: bind
        source: ./.local/dev/meilisearch
        target: /meili_data

  vllm:
    profiles: [hybrid]
    mem_limit: 4g
    cpus: 2.0
    # Pin the image version so CLI changes in `latest` do not break startup.
    image: vllm/vllm-openai:v0.19.0
    restart: unless-stopped
    command: >
      BAAI/bge-m3
      --runner pooling
      --gpu-memory-utilization 0.6
      --max-model-len 2048
      --max-num-batched-tokens 2048
      --max-num-seqs 32
      --port 8000
      --trust-remote-code
    ports:
      - "127.0.0.1:${VLLM_PORT:-8000}:8000"
    volumes:
      - ~/.cache/huggingface:/root/.cache/huggingface
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
