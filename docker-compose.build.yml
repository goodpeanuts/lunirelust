# Optional containerized application build; native `just dev` is the normal workflow.
# `just build` builds and starts the app and selected middleware.

services:
  app:
    mem_limit: 1g
    cpus: 2.0
    build:
      context: .
      dockerfile: Dockerfile.local
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${SERVICE_PORT:-8012}:${SERVICE_PORT:-8012}"
    env_file:
      - ${DEPLOY_ENV_FILE}
    volumes:
      - ${ASSETS_DATA_PATH}:/app/${ASSETS_HOME_PATH}
    environment:
      - DATABASE_URL=postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      - MEILI_URL=http://meilisearch:7700
      - VLLM_EMBEDDING_URL=http://vllm:8000
